name: Release

# Runs when a PR is merged (= push to main). Creates the release v<manifest version> (always as
# pre-release: the project stays in beta)
# if it does not exist yet; the PR check guarantees the version was bumped.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/pv_assistant/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          # Previous release tag (highest v* tag below the current one), for the changelog.
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
          # one line per pull request (its title from GitHub) for the merge commits on the main line; direct commits and squash
          # merges show their subject
          range="${GITHUB_SHA}"
          [ -n "$prev" ] && range="${prev}..${GITHUB_SHA}"
          {
            echo "## Changes"
            echo
            git log "$range" --first-parent --pretty='%H' | while read -r h; do
              if [ "$(git rev-list --parents -n1 "$h" | wc -w)" -gt 2 ]; then
                num=$(git log -1 --pretty=%s "$h" | sed -n 's/^Merge pull request #\([0-9]*\) .*/\1/p')
                # the merge commit has no title: ask GitHub, fall back to the last commit of the branch
                title=$(gh pr view "$num" --json title --jq .title 2>/dev/null || true)
                echo "- ${title:-$(git log -1 --pretty=%s "${h}^2")}${num:+ (#$num)}"
              else
                echo "- $(git log -1 --pretty=%s "$h")"
              fi
            done
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            fi
          } > release-notes.md
          (cd custom_components/pv_assistant && zip -qr "$GITHUB_WORKSPACE/pv_assistant.zip" .)
          gh release create "$tag" pv_assistant.zip \
            --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md --prerelease
